services:
  - type: web
    name: youtube-transcriber-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_bot.py
    envVars:
      - key: PYTHONPATH
        value: .
      - key: TELEGRAM_TOKEN
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_URL
        sync: false 